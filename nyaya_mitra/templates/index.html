<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Query Assistant</title>
</head>
<body>
    <h1>Legal Query Assistant</h1>
    
    <form method="POST">
        <label for="query">Enter your legal query:</label>
        <input type="text" id="query" name="query" required>
        <button type="submit">Submit</button>
    </form>

    {% if query %}
        <h3>Query: {{ query }}</h3>
        <h4>Retrieved Context:</h4>
        <pre>{{ context }}</pre>

        <h4>LLaMA2 Response:</h4>
        <pre>{{ response }}</pre>
    {% endif %}
</body>
</html>
